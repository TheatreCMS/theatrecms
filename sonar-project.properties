# SonarQube Cloud (https://sonarcloud.io) analysis, run by .github/workflows/ci.yml.
# The organization and project keys must match the project imported on sonarcloud.io.
sonar.organization=theatrecms
sonar.projectKey=TheatreCMS_theatrecms
sonar.projectName=TheatreCMS

sonar.sources=src,app,www/assets/js
# Vendored EditorJS builds are third-party code.
sonar.exclusions=www/assets/js/editorjs/**
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Produced by the PHPUnit step.
sonar.php.coverage.reportPaths=build/coverage.xml
sonar.php.tests.reportPath=build/junit.xml
