<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="cc">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="#1c1c1e"/>

  <g clip-path="url(#cc)">

    <!-- Yoke: shifted left and down from previous position -->
    <!-- C-clamp vertical -->
    <rect x="67" y="30" width="10" height="14" rx="2" fill="#ffffff"/>
    <!-- Horizontal clamp bar -->
    <rect x="58" y="36" width="28" height="7" rx="2" fill="#ffffff"/>
    <!-- Left yoke arm -->
    <rect x="58" y="42" width="5" height="32" rx="2" fill="#ffffff"/>
    <!-- Right yoke arm -->
    <rect x="81" y="42" width="5" height="32" rx="2" fill="#ffffff"/>

    <!-- Barrel + beam: pivot at (72, 74), pointing right at -55° -->
    <g transform="translate(72, 74) rotate(-55)">

      <!-- Beam -->
      <polygon points="-8,43 8,43 60,185 -60,185" fill="#ffffff" opacity="0.08"/>
      <polygon points="-7,43 7,43 40,185 -40,185" fill="#ffffff" opacity="0.08"/>
      <polygon points="-5,43 5,43 18,185 -18,185" fill="#ffffff" opacity="0.07"/>

      <!-- Main barrel body -->
      <rect x="-17" y="-20" width="34" height="50" rx="6" fill="#ffffff"/>

      <!-- Shutter housing bump -->
      <rect x="-19" y="-9" width="38" height="18" rx="4" fill="#ffffff"/>

      <!-- Lens barrel -->
      <rect x="-13" y="28" width="26" height="13" rx="4" fill="#ffffff"/>

      <!-- Lens face -->
      <ellipse cx="0" cy="42" rx="12" ry="4.5" fill="#1c1c1e" opacity="0.5"/>

      <!-- Shutter blade lines -->
      <line x1="-18" y1="-3" x2="18" y2="-3" stroke="#1c1c1e" stroke-width="2" opacity="0.4"/>
      <line x1="-18" y1="4"  x2="18" y2="4"  stroke="#1c1c1e" stroke-width="2" opacity="0.4"/>

    </g>

  </g>

</svg>
