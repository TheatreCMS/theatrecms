build:
  # The default image's glibc is too old for Node 20 and it has no PHP 8.4 build.
  # jammy defaults to PHP 8.1; pin an exact 8.4 patch release so it installs that instead.
  image: default-jammy
  environment:
    php:
      version: 8.4.11

  dependencies:
    before:
      - composer install --no-interaction --prefer-dist

  nodes:
    analysis:
      # Overrides the repository's website config on scrutinizer-ci.com, which pins this node to
      # PHP 8.1. The node's analysis steps (php-scrutinizer-run, phpcs-run, js-scrutinizer-run)
      # still come from that website config.
      environment:
        php:
          version: 8.4.11
    tests:
      tests:
        override:
          - ./vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit

checks:
  php:
    code_rating: true
    duplication: true
