build:
  # The default image's glibc is too old for Node 20 and it has no PHP 8.4 build.
  # jammy defaults to PHP 8.1; pin an exact 8.4 patch release so it installs that instead.
  image: default-jammy
  environment:
    php:
      version: 8.4.11
    # Scrutinizer runs `npm install` for package.json; the image's default npm can't read lockfile v3.
    node: v20.19.0

  dependencies:
    before:
      - composer install --no-interaction --prefer-dist

  # The analysis node's steps (php-scrutinizer-run, phpcs-run, js-scrutinizer-run) come from the
  # repository's website config on scrutinizer-ci.com.
  nodes:
    tests:
      tests:
        override:
          - ./vendor/bin/phpunit --configuration=phpunit.xml.dist tests/Unit

checks:
  php:
    code_rating: true
    duplication: true
